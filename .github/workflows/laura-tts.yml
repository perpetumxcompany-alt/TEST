name: laura-tts

# Synthesizes the same Russian test text with Qwen3-TTS, CosyVoice 3, Chatterbox and Gemini TTS
# on CPU runners, then commits mp3 samples to samples/ on this branch.
on:
  push:
    branches: [claude/laura-tts-samples]
    paths: ["tts/**", ".github/workflows/laura-tts.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: laura-tts
  cancel-in-progress: false

env:
  HF_HUB_DISABLE_PROGRESS_BARS: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  qwen-design:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q sox libsox-dev
      - run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts
      - run: python tts/gen_qwen.py design
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qwen-design, path: out/, if-no-files-found: ignore }

  qwen-custom:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q sox libsox-dev
      - run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts
      - run: python tts/gen_qwen.py custom
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: qwen-custom, path: out/, if-no-files-found: ignore }

  cosyvoice:
    needs: qwen-design
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: qwen-design, path: ref_in }
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q sox libsox-dev
      - name: Install CosyVoice (CPU)
        run: |
          git clone -q --depth 1 --recursive https://github.com/QwenAudio/CosyVoice.git
          pip install -q torch==2.3.1 torchaudio==2.3.1 --index-url https://download.pytorch.org/whl/cpu
          grep -vE '^\s*(--|#)|deepspeed|tensorrt|onnxruntime|gradio|fastapi|grpcio|uvicorn|^torch' CosyVoice/requirements.txt > req.txt
          pip install -q onnxruntime==1.18.0 huggingface_hub
          while read -r p; do [ -n "$p" ] && { pip install -q "$p" || echo "::warning::failed to install $p"; }; done < req.txt
      - name: Download model
        run: python -c "from huggingface_hub import snapshot_download; snapshot_download('FunAudioLLM/Fun-CosyVoice3-0.5B-2512', local_dir='pretrained_models/Fun-CosyVoice3-0.5B')"
      - run: python tts/gen_cosyvoice.py cosyvoice3-laura-ref=ref_in/qwen/laura_ref.wav cosyvoice3-irina-ref=tts/fallback_ref.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: cosyvoice, path: out/, if-no-files-found: ignore }

  chatterbox:
    needs: qwen-design
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with: { name: qwen-design, path: ref_in }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install Chatterbox (CPU)
        run: |
          pip install -q torch==2.6.0 torchaudio==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install -q "chatterbox-tts @ git+https://github.com/resemble-ai/chatterbox.git"
      - run: python tts/gen_chatterbox.py chatterbox-default=default chatterbox-laura-ref=ref_in/qwen/laura_ref.wav chatterbox-irina-ref=tts/fallback_ref.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: chatterbox, path: out/, if-no-files-found: ignore }

  gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python tts/gen_gemini.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: gemini, path: out/, if-no-files-found: ignore }

  collect:
    needs: [qwen-design, qwen-custom, cosyvoice, chatterbox, gemini]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: out, merge-multiple: true }
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - name: Convert and commit samples
        run: |
          mkdir -p samples
          find out -name '*.wav' | while read -r f; do
            ffmpeg -loglevel error -y -i "$f" -ac 1 -b:a 128k "samples/$(basename "$f" .wav).mp3"
          done
          for d in out/*/; do e=$(basename "$d"); for m in "$d"meta*.json; do [ -f "$m" ] && cp "$m" "samples/$e-$(basename "$m")"; done; done
          cat > samples/STATUS.txt <<EOF
          run ${{ github.run_id }} attempt ${{ github.run_attempt }}
          qwen-design: ${{ needs.qwen-design.result }}
          qwen-custom: ${{ needs.qwen-custom.result }}
          cosyvoice: ${{ needs.cosyvoice.result }}
          chatterbox: ${{ needs.chatterbox.result }}
          gemini: ${{ needs.gemini.result }}
          EOF
          ls -la samples
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add samples
          git commit -q -m "Add TTS samples from run ${{ github.run_id }}" || { echo "nothing new"; exit 0; }
          git pull -q --rebase origin "${GITHUB_REF_NAME}"
          git push -q origin "HEAD:${GITHUB_REF_NAME}"
