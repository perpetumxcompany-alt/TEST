name: laura-tts-calm

# Calm Laura voices with Qwen3-TTS: four designed voices fixed by cloning, plus Serena with a calm instruction.
on:
  push:
    branches: [claude/laura-tts-samples]
    paths: [".github/workflows/laura-tts-calm.yml", "ci/qwen_calm.py"]

permissions:
  contents: write

concurrency:
  group: laura-tts-calm
  cancel-in-progress: true

jobs:
  qwen:
    strategy:
      fail-fast: false
      matrix:
        mode: [design, serena]
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -q && sudo apt-get install -y -q sox libsox-dev
      - run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q qwen-tts imageio-ffmpeg
      - run: python ci/qwen_calm.py ${{ matrix.mode }}
      - name: Commit samples
        run: |
          FF=$(python -c "import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch -q origin "$GITHUB_REF_NAME" && git reset -q --hard "origin/$GITHUB_REF_NAME"
          mkdir -p samples
          for f in out/qwen-calm/*.wav; do "$FF" -loglevel error -y -i "$f" -ac 1 -b:a 128k "samples/$(basename "$f" .wav).mp3"; done
          cp out/qwen-calm/meta-${{ matrix.mode }}.json samples/qwen-calm-meta-${{ matrix.mode }}.json
          git add samples && git commit -q -m "Add calm Qwen3-TTS samples (${{ matrix.mode }})"
          for i in 1 2 3 4 5; do git push -q origin "HEAD:$GITHUB_REF_NAME" && break; sleep 3; git pull -q --rebase origin "$GITHUB_REF_NAME"; done
